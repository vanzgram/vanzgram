<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VanzGram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">Vanz<span>Gram</span></div>
            <div id="accountName"></div>
        </header>

        <!-- LOGIN -->
        <section id="loginPage" class="auth">
            <h2>Selamat Datang!</h2>
            <p>Login ke akun VanzGram kamu</p>

            <input type="text" id="loginUser" placeholder="Username atau Email" required>
            <input id="loginPass" type="password" placeholder="Password">

            <button class="primary" onclick="login()">LOGIN</button>

            <div class="switch">
                Belum punya akun?
                <button onclick="showRegister()">Daftar</button>
            </div>
        </section>

        <!-- REGISTER -->
        <section id="registerPage" class="auth hidden">
            <h2>Buat Akun VanzGram</h2>
            <p>Daftar dan mulai mengobrol!</p>

            <input type="text" id="regUser" placeholder="Username">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="number" id="regAge" placeholder="age">
            <input type="password" id="regPass" placeholder="Password">
            <input type="password" id="regConfirm" placeholder="confirm Password">

            <button class="primary" onclick="register()">DAFTAR</button>

            <div class="switch">
                Sudah punya akun?
                <button onclick="showLogin()">Login</button>
            </div>
        </section>

        <!-- MENU UTAMA -->
        <div id="content" class="hidden">
            <main id="mainContent"></main>

            <nav class="nav">
                <button onclick="navigate('chat')" id="nav-chat">
                    <span>💬</span>Chat
                </button>
                <button onclick="navigate('updates')" id="nav-updates">
                    <span>⭕</span>Pembaruan
                </button>
                <button onclick="navigate('groups')" id="nav-groups">
                    <span>👥</span>Grup
                </button>
                <button onclick="navigate('calls')" id="nav-calls">
                    <span>📞</span>Panggilan
                </button>
                <button onclick="navigate('profile')" id="nav-profile">
                    <span>👤</span>Profil
                </button>
            </nav>
        </div>
    </div>

    <!-- Aplikasi utama -->
    <script src="script.js"></script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            get,
            set,
            runTransaction
        } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBAzCNZi5rI8Ghv-GoV7hhuo43DwGXtrbM",
            authDomain: "vanzgram-26277.firebaseapp.com",
            databaseURL: "https://vanzgram-26277-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vanzgram-26277",
            storageBucket: "vanzgram-26277.firebasestorage.app",
            messagingSenderId: "121881528856",
            appId: "1:121881528856:web:fc4aed901f4e98e4e3916d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.vanzgramAuth = auth;
        window.vanzgramDB = db;

        // Promise ini memberi tahu script.js bahwa Firebase sudah siap.
        let resolveFirebaseReady;
        window.firebaseReady = new Promise(resolve => {
            resolveFirebaseReady = resolve;
        });

        // FIREBASE AUTHENTICATION
        window.vanzgramCreateAccount = async function (email, password) {
            const credential = await createUserWithEmailAndPassword(auth, email, password);
            return credential.user;
        };

        window.vanzgramLoginAccount = async function (email, password) {
            const credential = await signInWithEmailAndPassword(auth, email, password);
            return credential.user;
        };

        // DATABASE HELPERS
        window.vanzgramUsernameExists = async function (username) {
            const snapshot = await get(
                ref(db, "usernameIndex/" + username.toLowerCase())
            );
            return snapshot.exists();
        };

        window.vanzgramReserve = async function (path, value) {
            const result = await runTransaction(
                ref(db, path),
                current => current === null ? value : undefined
            );
            return result.committed;
        };

        window.vanzgramSaveProfile = async function (uid, profile) {
            await set(ref(db, "users/" + uid), profile);
        };

        window.vanzgramGetProfile = async function (uid) {
            const snapshot = await get(ref(db, "users/" + uid));
            return snapshot.exists() ? snapshot.val() : null;
        };

        // MIGRASI AKUN LAMA VANZ
        // Hanya memindahkan username dan ID. Password lama, umur, foto base64,
        // dan status verifikasi tidak ditulis ke profil publik Firebase.
        window.vanzgramMigrateOldAccount = async function (email, password) {
            await window.firebaseReady;

            const oldUsers = JSON.parse(
                localStorage.getItem("vanzgram_users") || "[]"
            );

            const oldUser = oldUsers.find(
                user => String(user.username || "").toLowerCase() === "vanz"
            );

            if (!oldUser || String(oldUser.id) !== "544523") {
                throw new Error("Data akun Vanz lama dengan ID 544523 tidak ditemukan di browser ini.");
            }

            const username = oldUser.username.toLowerCase();
            const oldId = String(oldUser.id);

            // Periksa kedua indeks sebelum membuat akun Auth.
            const usernameSnapshot = await get(
                ref(db, "usernameIndex/" + username)
            );
            const idSnapshot = await get(
                ref(db, "idIndex/" + oldId)
            );

            if (usernameSnapshot.exists() || idSnapshot.exists()) {
                throw new Error("Username atau ID sudah terdaftar di Firebase. Migrasi dihentikan agar tidak menimpa akun lain.");
            }

            // Membuat akun Firebase baru akan mengganti sesi Auth browser
            // yang sedang aktif. Data akun sebelumnya di database tidak dihapus.
            const credential = await createUserWithEmailAndPassword(
                auth,
                email.trim(),
                password
            );
            const uid = credential.user.uid;

            // Cadangkan username dan ID secara create-only.
            const usernameReserved = await window.vanzgramReserve(
                "usernameIndex/" + username,
                uid
            );

            if (!usernameReserved) {
                throw new Error("Username gagal dicadangkan. Akun Auth baru mungkin sudah terbentuk; jangan ulangi migrasi sebelum memeriksa Firebase Authentication.");
            }

            const idReserved = await window.vanzgramReserve(
                "idIndex/" + oldId,
                uid
            );

            if (!idReserved) {
                throw new Error("ID gagal dicadangkan. Username sudah tercadangkan dan akun Auth mungkin sudah terbentuk; jangan ulangi migrasi sebelum memeriksa Firebase.");
            }

            const profile = {
                username: oldUser.username,
                id: oldId
            };

            await window.vanzgramSaveProfile(uid, profile);

            localStorage.setItem("vanzgram_session", oldUser.username);
            localStorage.setItem("vanzgram_uid", uid);

            return profile;
        };

        console.log("VanzGram Firebase Authentication siap!");
        console.log("VanzGram Database Functions siap!");
        resolveFirebaseReady();
    </script>
</body>
</html>
